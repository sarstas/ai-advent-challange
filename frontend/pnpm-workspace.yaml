# pnpm 10+ по умолчанию запрещает postinstall-скрипты зависимостей.
# Сборке Angular нужны нативные бинарники этих пакетов — разрешаем явно.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.2'
  - '@angular-devkit/core@22.2.2'
  - '@angular-devkit/schematics@22.2.2'
  - '@angular/build@22.2.2'
  - '@angular/cli@22.2.2'
  - '@schematics/angular@22.2.2'
